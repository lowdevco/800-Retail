{% extends 'dashboard/LayoutMain.html' %}
{% load static %}
{% block content %}

    <div class="pagetitle">
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
          <li class="breadcrumb-item"><a href="{% url 'usergroup' %}">Usergroup</a></li>
          <li class="breadcrumb-item active">Add User Group</li>
        </ol>
      </nav>
    </div>

    <section class="section profile">
      <div class="container my-4">
        <div class="row justify-content-center">
          <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm modern-card">
              <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span class="card-header-title">Add New User Group</span>
                <a href="{% url 'usergroup' %}" class="btn btn-light btn-sm">Back</a>
              </div>
              <div class="card-body p-4">
                <form method="post">
                  {% csrf_token %}
                  <div class="mb-3">
                    <label class="form-label fw-bold">User Group Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" placeholder="Enter group name" required>
                  </div>
                  <div class="d-flex gap-2 justify-content-end mt-4">
                    <a href="{% url 'usergroup' %}" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">Add Group</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

{% endblock %}
