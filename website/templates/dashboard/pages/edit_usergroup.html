{% extends 'dashboard/LayoutMain.html' %}
{% load static %}

{% block content %}

    <div class="pagetitle">
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
          <li class="breadcrumb-item"><a href="{% url 'usergroup' %}">Usergroup</a></li>
          <li class="breadcrumb-item active">Edit User Group</li>
        </ol>
      </nav>
    </div>

    <section class="section profile">
      <div class="container my-4">
        <div class="row justify-content-center">
          <div class="col-md-7 col-lg-6">
            <form method="POST">
              {% csrf_token %}

              <div class="card border-0 shadow-sm modern-card">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                  <span class="card-header-title">Edit User Group</span>
                  <a href="{% url 'usergroup' %}" class="btn btn-light btn-sm">Back</a>
                </div>

                <div class="card-body p-4">
                  <div class="mb-3">
                    <label class="form-label fw-bold">
                      Group Name <span class="text-danger">*</span>
                    </label>
                    <input type="text" name="name" class="form-control {% if form.name.errors %}is-invalid{% endif %}"
                      value="{{ form.name.value|default:usergroup.name }}"
                      placeholder="Enter group name">
                    {% if form.name.errors %}
                    <div class="invalid-feedback">{{ form.name.errors|join:", " }}</div>
                    {% endif %}
                  </div>

                  <div class="d-flex gap-2 justify-content-end mt-4">
                    <a href="{% url 'usergroup' %}" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">
                      Save Changes
                    </button>
                  </div>
                </div>
              </div>

            </form>
          </div>
        </div>
      </div>
    </section>

{% endblock %}
