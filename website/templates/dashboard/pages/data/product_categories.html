{% extends 'dashboard/LayoutMain.html' %}
{% load static %}

{% block content %}
    <div class="pagetitle">
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
                <li class="breadcrumb-item active">Product Categories</li>
            </ol>
        </nav>
    </div>

    <section class="section profile">
        <div class="content">
            <div class="container-fluid my-4">
                <div class="card border-0 shadow-sm modern-card">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <span class="card-header-title">Product Categories</span>
                        <a href="{% url 'add_product_category' %}" class="btn btn-light btn-sm">
                            <i class="fas fa-plus"></i> Add New Category
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive mt-3">
                            <table class="table table-hover table-striped">
                                <thead>
                                    <tr>
                                        <th>Category Name</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for category in categories %}
                                    <tr>
                                        <td>{{ category.name }}</td>
                                        <td class="text-center">
                                            <a href="{% url 'edit_product_category' category.id %}" class="btn btn-sm btn-outline-primary" title="Edit">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <a href="{% url 'delete_product_category' category.id %}" class="btn btn-sm btn-outline-danger" title="Delete" onclick="return confirm('Are you sure you want to delete this category?');">
                                                <i class="fas fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    {% empty %}
                                    <tr><td colspan="2" class="text-center">No categories found.</td></tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
